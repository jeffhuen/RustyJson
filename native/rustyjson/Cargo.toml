[package]
name = "rustyjson"
version = "0.4.1"
authors = ["Jeff Huen"]
edition = "2021"

[lib]
name = "rustyjson"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
flate2 = "1.0"
rustler = { version = "0.38", features = ["big_integer"] }
itoa = "1.0"
ryu = "1.0"
lexical-core = "1.0"
num-bigint = "0.4"
simdutf8 = "0.1"
smallvec = "1.13"
mimalloc = { version = "0.1", default-features = false, optional = true }
tikv-jemallocator = { version = "0.7", optional = true }
snmalloc-rs = { version = "0.7", optional = true }

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false, optional = true, features = ["local_dynamic_tls"] }

[features]
# No allocator is bundled by default.
#
# A NIF is a shared library loaded into a BEAM that may already host other NIFs.
# mimalloc linked into a .so keeps its arenas and page map private to that .so,
# but on macOS it stores the per-thread default heap in a *fixed* TLS slot. Two
# NIFs that each bundle mimalloc share that slot while keeping separate page
# maps, so one copy's `mi_realloc` can be handed a block the other allocated,
# miss its page-map lookup, report a usable size of 0, and copy zero bytes --
# silently returning fresh memory and freeing the original. That corrupts live
# terms and takes the whole VM down.
#
# See docs/ALLOCATOR_SAFETY.md before enabling `mimalloc`, `jemalloc` or
# `snmalloc`. `mimalloc/local_dynamic_tls` does NOT avoid this; the fixed-slot
# fast path is independent of the TLS model (verified).
default = []
mimalloc = ["dep:mimalloc"]
jemalloc = ["dep:tikv-jemallocator"]
snmalloc = ["dep:snmalloc-rs"]
# NIF version features for rustler_precompiled
# (OTP 24+ = 2.15, OTP 26 = 2.16, OTP 27/28 = 2.17, OTP 29 = 2.18)
# 2.18 is defined here but not yet wired into `nif_versions` in lib/rustyjson.ex:
# rustler_precompiled 0.9.0 caps `@available_nif_versions` at 2.17, so OTP 29
# currently loads the 2.17 artifact. Enable once upstream allows 2.18.
nif_version_2_15 = ["rustler/nif_version_2_15"]
nif_version_2_16 = ["rustler/nif_version_2_16"]
nif_version_2_17 = ["rustler/nif_version_2_17"]
nif_version_2_18 = ["rustler/nif_version_2_18"]
bench = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "decode_bench"
harness = false
required-features = ["bench"]

[[bench]]
name = "encode_bench"
harness = false
required-features = ["bench"]
